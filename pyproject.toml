[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finnish-vocab-learning-nlp"
version = "0.1.0"
description = "Config-driven multilingual lemma/rank data pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
core = []
fi = [
  "spacy>=3.8,<4",
  "libvoikko>=4.3",
]
en = [
  "lemminflect>=0.2.3",
]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
